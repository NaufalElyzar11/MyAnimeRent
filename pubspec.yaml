name: myanimerent
description: "MyAnimeRent - Anime Costume Rental App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  firebase_database: ^11.3.4
  provider: ^6.1.4
  cached_network_image: ^3.4.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  go_router: ^15.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
