name: myanimerent
description: "MyAnimeRent - Anime Costume Rental App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Backend: Supabase (Auth, Postgres, Storage, Edge Functions). Firebase hanya untuk push (FCM).
  supabase_flutter: ^2.18.3
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  provider: ^6.1.4
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: standard
  uses-material-design: true
  assets:
    - assets/images/
    - assets/event/
    - assets/event/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
